# JWT Configuration
jwt.secret=HrmsLocalDevelopmentSecretKey2026Secure

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/hrms
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=varma
spring.datasource.password=

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP Connection Pool (Optimized for SSH Tunnel Stability)
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000

# Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Temporary AWS values for local testing
aws.s3.bucket-name=local-test-bucket
aws.region=ap-south-1
aws.ses.sender-email=test@example.com

# AWS ElastiCache Redis Configuration (Routed via EC2 SSH tunnel on port 6379)
spring.data.redis.host=localhost
spring.data.redis.port=6379
