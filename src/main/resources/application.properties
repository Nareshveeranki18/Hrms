# JWT Configuration
jwt.secret=HrmsLocalDevelopmentSecretKey2026Secure

# Server Configuration
server.port=8080

# File Upload Limits (Matches frontend 10 MB limit)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Neon PostgreSQL Cloud Database Configuration
spring.datasource.url=jdbc:postgresql://ep-proud-sun-a1kmtbeh.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool (Fixed pool warnings & optimized for Neon Cloud)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Hibernate & JPA Config (Clean console output)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
logging.level.org.hibernate.orm.jdbc.warn=ERROR

# Storage Mode ('local' uses ./uploads without AWS keys; switch to 's3' once AWS is ready)
app.storage.type=local
app.storage.local-dir=./uploads
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000

# Temporary AWS values for local testing
aws.s3.bucket-name=local-test-bucket
aws.region=ap-south-1
aws.ses.sender-email=test@example.com

# AWS ElastiCache Redis Configuration (Routed via EC2 SSH tunnel on port 6379)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false