# JWT Configuration
jwt.secret=HrmsLocalDevelopmentSecretKey2026Secure

# Server Configuration
server.port=8080

# Neon PostgreSQL Cloud Database Configuration
spring.datasource.url=jdbc:postgresql://ep-proud-sun-a1kmtbeh.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool (Optimized for SSH Tunnel & Cloud Stability)
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000

# Hibernate Config (Set to PostgreSQL Dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Temporary AWS values for local testing
aws.s3.bucket-name=local-test-bucket
aws.region=ap-south-1
aws.ses.sender-email=test@example.com

# AWS ElastiCache Redis Configuration (Routed via EC2 SSH tunnel on port 6379)
spring.data.redis.host=localhost
spring.data.redis.port=6379